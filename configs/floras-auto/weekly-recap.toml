# Floras Auto — Weekly Auction Recap (global config)
#
# Engine, scheduler, turn limit, and file-access settings for the Weekly
# Auction Recap operator. The operator itself is defined by
# configs/floras-auto/operators/floras_weekly_recap.toml.
#
# Install with:  scripts/floras-auto/setup-weekly-recap.sh [NOTES_DIR] [RECAPS_DIR] [BUNDLE_DIR]
# The script rewrites security.allowed_dirs to the folders you choose.
#
# Operators read ~/.openjarvis/config.toml for the engine, model, turn limit,
# scheduler, and security settings, so this file must be the active config
# when the scheduler runs.

[engine]
default = "ollama"

[engine.ollama]
# Uncomment and set when Ollama runs on another machine on the shop network.
# host = "http://192.168.1.50:11434"

[intelligence]
# qwen3.5:9b needs roughly 7 GB of RAM. Use qwen3.5:4b on smaller machines.
default_model = "qwen3.5:9b"
temperature = 0.2
# The default of 1,024 output tokens is too close: writing the recap took
# about 650 tokens in testing, and a call that is cut off writes nothing.
max_tokens = 2048

[agent]
default_agent = "simple"            # Plain chat stays usable; the recap is an operator.
# Operators take their turn limit from here, not from the manifest. A run
# needs about six turns: last recap, notes bundle, think, write, reply.
max_turns = 14
context_from_memory = false

[scheduler]
enabled = true                      # Required: operators are scheduler tasks.
poll_interval = 60

[operators]
enabled = true
# manifests_dir defaults to ~/.openjarvis/operators, where `jarvis operators install` puts manifests.
# auto_activate = "floras_weekly_recap"   # Uncomment to activate on scheduler start.

[tools]
enabled = ["file_read", "file_write", "calculator", "think"]

[tools.storage]
# Deliberately not a real backend: no backend is registered under this name,
# so the system runs without memory. Memory is shared by every agent on the
# machine, and the recap would otherwise pull other agents' leftovers into
# its prompt as "previous state". It compares against last week's recap file
# instead.
default_backend = "none"

[security]
profile = "personal"
# file_read and file_write refuse anything outside these folders. The setup
# script replaces them with the recaps folder and the notes-bundle folder.
# The recaps folder comes first: a file saved without a full path lands in
# the first folder listed. The agent never needs the notes folder itself.
allowed_dirs = ["~/FlorasAuto/recaps", "~/FlorasAuto/jarvis"]

[analytics]
enabled = false
choice_recorded = true
