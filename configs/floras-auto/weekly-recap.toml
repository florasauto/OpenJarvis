# Floras Auto — Weekly Auction Recap (global config)
#
# Engine, scheduler, memory, and file-access settings for the Weekly Auction
# Recap operator. The operator itself is defined by
# configs/floras-auto/operators/floras_weekly_recap.toml.
#
# Install with:  scripts/floras-auto/setup-weekly-recap.sh [NOTES_DIR] [RECAPS_DIR]
# The script rewrites security.allowed_dirs to the folders you choose.
#
# Operators read ~/.openjarvis/config.toml for the engine, model, memory
# backend, scheduler, and security settings, so this file must be the active
# config when the scheduler runs.

[engine]
default = "ollama"

[engine.ollama]
# Uncomment and set when Ollama runs on another machine on the shop network.
# host = "http://192.168.1.50:11434"

[intelligence]
# qwen3.5:9b needs roughly 6 GB of RAM. Use qwen3.5:4b on smaller machines.
default_model = "qwen3.5:9b"
temperature = 0.2

[agent]
default_agent = "simple"            # Plain chat stays usable; the recap is an operator.
max_turns = 20                      # Operators take their turn limit from here, not the manifest.
context_from_memory = false

[memory]
default_backend = "sqlite"          # Operator state and the retrieval tool use memory.db.

[scheduler]
enabled = true                      # Required: operators are scheduler tasks.
poll_interval = 60

[operators]
enabled = true
# manifests_dir defaults to ~/.openjarvis/operators, where `jarvis operators install` puts manifests.
# auto_activate = "floras_weekly_recap"   # Uncomment to activate on scheduler start.

[tools]
enabled = ["retrieval", "file_read", "file_write", "calculator", "think"]

[security]
profile = "personal"
# file_read and file_write refuse anything outside these folders. The setup
# script replaces them with the notes folder and the recaps folder you pick.
allowed_dirs = ["~/FlorasAuto/overnight-notes", "~/FlorasAuto/recaps"]

[analytics]
enabled = false
choice_recorded = true
