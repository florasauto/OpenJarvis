# Floras Auto — Title and Transport Watch (global config)
#
# Engine, model, memory, and file-access settings for the managed
# "Title and Transport Watch" agent. The agent itself is defined by
# configs/floras-auto/templates/floras_title_watch.toml.
#
# Install with:  scripts/floras-auto/setup-title-watch.sh [NOTES_DIR] [STATUS_DIR]
# The script rewrites security.allowed_dirs to the folders you choose.
#
# Managed agents read ~/.openjarvis/config.toml for the engine, model, memory
# backend, and security settings, so this file must be the active config when
# the agent daemon runs.

[engine]
default = "ollama"

[engine.ollama]
# Uncomment and set when Ollama runs on another machine on the shop network.
# host = "http://192.168.1.50:11434"

[intelligence]
# qwen3.5:9b needs roughly 6 GB of RAM. Use qwen3.5:4b on smaller machines.
default_model = "qwen3.5:9b"
temperature = 0.2                   # Low temperature keeps status pages consistent.

[agent]
default_agent = "simple"            # Plain chat stays usable; the watch is a managed agent.
context_from_memory = false

[memory]
default_backend = "sqlite"          # Where memory_store / memory_retrieve persist between ticks.

[tools]
enabled = ["file_read", "file_write", "memory_store", "memory_retrieve", "memory_search", "think"]

[tools.storage]
default_backend = "sqlite"

[security]
profile = "personal"
# file_read and file_write refuse anything outside these folders. The setup
# script replaces them with the notes folder and the status folder you pick.
allowed_dirs = ["~/FlorasAuto/overnight-notes", "~/FlorasAuto/status"]

[analytics]
enabled = false
choice_recorded = true
