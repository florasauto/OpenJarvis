# Floras Auto — Scheduled Monitor
#
# Operative agent that reviews overnight auction and purchase notes every
# morning: every unit bought, its title and transport status, and what needs
# a call today. It reads the notes from the recent-notes bundle written by
# scripts/floras-auto/refresh-notes.py, and it runs without memory.
#
# Install with:  scripts/floras-auto/setup-scheduled-monitor.sh [NOTES_DIR] [CRON] [BUNDLE_DIR]
# The script writes the real bundle folder into allowed_dirs below and the
# bundle path into the task, so do not install this file by hand.
#
# Based on the upstream scheduled-monitor preset
# (configs/openjarvis/examples/scheduled-monitor.toml).

[engine]
default = "ollama"

[engine.ollama]
# Uncomment and set when Ollama runs on another machine on the shop network.
# host = "http://192.168.1.50:11434"

[intelligence]
# qwen3.5:9b needs roughly 6 GB of RAM. Use qwen3.5:4b on smaller machines.
default_model = "qwen3.5:9b"
# Kept low on purpose: at 0.3 the same task behaved differently on every run.
temperature = 0.1
# Output allowance per model turn. The default of 1,024 tokens is a trap for
# tool-using agents: a tool call that is cut off returns nothing, and the run
# ends with an empty answer and no error.
max_tokens = 2048

[agent]
default_agent = "operative"
# A run takes two turns: read the bundle, write the review.
max_turns = 8
# Off on purpose. With it on, the summary an earlier run had stored was fed
# back in, and the second morning's review repeated the first morning's
# statuses instead of reading the new note.
context_from_memory = false

[tools]
# web_search is intentionally left out: the monitor should only read the
# team's own notes, so nothing leaves the local machine.
# file_read is its only tool. It reads one file, the recent-notes bundle,
# with every recent note in date order. Until 2026-11-13 the notes reached
# it through memory search, which hands over the five best-matching pieces
# in no particular order. On four short test notes it dropped a unit and
# missed a rebooked pickup, and on a real week of notes five pieces could
# not cover every unit.
# memory_store is gone too: see context_from_memory above. The review is the
# task's result, kept in the scheduler's run log.
# knowledge_search, knowledge_sql, and scan_chunks from the upstream preset
# are left out: on the scheduler path they have no knowledge store and
# answer "No knowledge store configured", which cost the monitor a wasted
# turn in the real-model run of 2026-11-11.
# think is left out as well: unattended, the model once spent its whole
# output allowance on a single think call and returned nothing.
enabled = ["file_read"]

[tools.storage]
# Deliberately not a real backend: no backend is registered under this name,
# so the system runs without memory, like the title watch and the weekly
# recap. Memory is shared by every agent on the machine.
default_backend = "none"

[security]
profile = "personal"
# The only folder file_read may open. The path is a placeholder; the setup
# script replaces it with the notes-bundle folder.
allowed_dirs = ["~/FlorasAuto/jarvis"]

[analytics]
enabled = false
choice_recorded = true
